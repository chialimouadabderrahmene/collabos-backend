name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-build-test:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  frontend:
    name: Frontend lint, typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Server-only; the build never contacts it.
      API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build

  migration-check:
    name: Validate Prisma migrations against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collabos
          POSTGRES_PASSWORD: collabos
          POSTGRES_DB: collabos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collabos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://collabos:collabos@localhost:5432/collabos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Validate schema matches migrations
        run: npx prisma migrate status

      - name: Integration tests (immutability trigger, concurrent publish, tenant isolation)
        run: npm run test:integration
        env:
          INTEGRATION_DATABASE_URL: postgresql://collabos:collabos@localhost:5432/collabos

  docker-build:
    name: Docker production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t collabos-backend:ci .
